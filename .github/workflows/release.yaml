name: Build and publish

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python:
          - cp311-cp311
          - cp312-cp312
          - cp313-cp313
          - cp314-cp314
        platform:
          - target: x86_64-unknown-linux-gnu
            compatibility: "2_28"
            image: quay.io/pypa/manylinux_2_28_x86_64:latest
          - target: x86_64-unknown-linux-musl
            compatibility: musllinux_1_2
            image: quay.io/pypa/musllinux_1_2_x86_64:latest

    steps:
      - uses: actions/checkout@v7

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(
              Path("pyproject.toml").read_text()
          )["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{project}"
          PY

      - name: Build wheel inside Docker
        uses: PyO3/maturin-action@v1
        with:
          command: build
          rust-toolchain: stable
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.compatibility }}
          container: ${{ matrix.platform.image }}
          args: >-
            --release
            --locked
            --out dist
            --interpreter /opt/python/${{ matrix.python }}/bin/python

      - name: Test installed Linux wheel
        env:
          TEST_IMAGE: ${{ matrix.platform.image }}
          TEST_PYTHON: /opt/python/${{ matrix.python }}/bin/python
        run: |
          docker run --rm \
            --volume "$PWD/dist:/dist:ro" \
            --volume "$PWD/tests:/tests:ro" \
            --env TEST_PYTHON \
            "$TEST_IMAGE" sh -eu -c '
              "$TEST_PYTHON" -m pip install --no-index /dist/*.whl
              "$TEST_PYTHON" -I -m unittest discover -s /tests -v
            '

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.target }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin

    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build macOS wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: build
          target: ${{ matrix.platform.target }}
          args: >-
            --release
            --locked
            --out dist
            --interpreter python

      - uses: astral-sh/setup-uv@v7.6.0

      - name: Test installed macOS wheel
        run: |
          uv venv --python python .wheel-venv
          uv pip install --python .wheel-venv/bin/python --no-index dist/*.whl
          .wheel-venv/bin/python -I -m unittest discover -s tests -v

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.target }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/lita-tokenizers-kytea-py
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
